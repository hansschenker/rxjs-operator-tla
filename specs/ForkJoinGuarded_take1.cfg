\* forkJoin([a$, b$.pipe(take(1))]) with a B that keeps delivering and never
\* completes: take(1) completes the branch on the first value.
SPECIFICATION SpecChattyB
CONSTANTS
  Guard   = "take1"
  MaxTime = 0
  Values  = {x, y}
  Default = dflt
  D       = 2
  MaxLen  = 2
INVARIANTS
  TypeOK
  NothingBeforeAllComplete
  AtMostOneEmission
  EmitsJoinedValues
  UnsubscribedWhenBranchDone
  BranchMatchesGuard
  BranchCompletesWithValue
PROPERTIES
  ObservableContract
  DeliveryCompletes
  EventuallyTerminal
