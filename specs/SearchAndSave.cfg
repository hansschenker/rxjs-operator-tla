\* terms$.pipe(switchMap(search), concatMap(save)): the intended pipeline.
SPECIFICATION Spec
CONSTANTS
  SearchStrategy = "switch"
  SaveStrategy = "concat"
  MaxTerms = 3
  ResultsPerSearch = 2
INVARIANTS
  TypeOK
  AtMostOneSearch
  OnlyNewestSearch
  ResultsNotInterleaved
  SavesSerialised
  SavesInOrder
  NoLostSave
  NoDroppedSave
  OneSavePerResult
  AcksArePrefixOfResults
  NoStaleSave
  EveryResultSaved
  MidCompletesAfterSearches
  CompletesOnlyWhenAllSaved
PROPERTIES
  ObservableContract
  OnlyActiveSearchesDeliver
  OnlyActiveSavesAcknowledge
  Completes
