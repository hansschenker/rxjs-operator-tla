\* source$.pipe(retry(2), share()): one retry for every subscription.
SPECIFICATION Spec
CONSTANTS
  Subs     = {s1, s2}
  Retrying = {s1}
  Values   = {a, b}
  Count    = 2
  MaxLen   = 2
  Placement    = "before"
  ResetOnError = TRUE
INVARIANTS
  TypeOK
  OnMeansLive
  InSyncAtTail
  OneExecutionPerTermination
  RetriesBounded
  SharedProtection
  NoErrorBeforeExhaustion
PROPERTIES
  PerSubscriberContract
  MulticastStep
  ErrorReachesEveryone
