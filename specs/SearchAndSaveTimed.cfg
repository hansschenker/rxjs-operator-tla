\* concatMap(r => save(r).pipe(retry(1))): a failed save is retried in place and
\* the queue waits; the wait for an acknowledgement is bounded by the queue ahead.
SPECIFICATION Spec
CONSTANTS
  SaveFailure = "retryInner"
  Count            = 1
  SaveMin          = 1
  SaveMax          = 2
  MaxTerms         = 2
  ResultsPerSearch = 1
  MaxTime          = 8
INVARIANTS
  TypeOK
  AtMostOneSearch
  OnlyNewestSearch
  ResultsNotInterleaved
  SavesSerialised
  SavesInOrder
  OneSavePerResult
  NoStaleSave
  AcksAreDoneSaves
  RetriesBounded
  QueueSurvivesRetries
  TimerNeverOverdue
  AckLatencyBounded
  EveryResultAcked
PROPERTIES
  ObservableContract
  AckWhenDue
