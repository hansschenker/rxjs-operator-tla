\* forkJoin([a$, b$.pipe(takeUntil(timer(2)))]) with a B that may never deliver
\* or terminate: the timer completes the branch at frame 2 whatever B does.
SPECIFICATION SpecSilentB
CONSTANTS
  Guard   = "takeUntilTimer"
  MaxTime = 4
  Values  = {x, y}
  Default = dflt
  D       = 2
  MaxLen  = 2
INVARIANTS
  TypeOK
  NothingBeforeAllComplete
  AtMostOneEmission
  EmitsJoinedValues
  UnsubscribedWhenBranchDone
  BranchMatchesGuard
  BranchEndsByDeadline
PROPERTIES
  ObservableContract
  DeliveryCompletes
  EventuallyTerminal
