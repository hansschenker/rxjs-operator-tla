\* source$.pipe(catchError(sel), retry(2)): the fallback on every source error,
\* the source retried only when the fallback errors.
SPECIFICATION Spec
CONSTANTS
  Order = "catchFirst"
  Values         = {a, b}
  FallbackValues = {d}
  Count          = 2
  MaxTotal       = 3
  MaxFallback    = 1
INVARIANTS
  TypeOK
  AttemptsBounded
  RetriesBounded
  ValuesAccounted
  ErrorOnlyWhenExhausted
  DoneIffTerminal
  FallbackOnEveryError
  RetryOnlyOnFallbackError
PROPERTIES
  ObservableContract
  SourceErrorNeverDelivered
  Completes
