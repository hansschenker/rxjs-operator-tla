\* source$.pipe(share()) with s1 = shared$.pipe(retry(2)) and s2 = shared$:
\* a retry per subscription, on a share() that resets on error (the default).
SPECIFICATION Spec
CONSTANTS
  Subs     = {s1, s2}
  Retrying = {s1}
  Values   = {a, b}
  Count    = 2
  MaxLen   = 2
  Placement    = "after"
  ResetOnError = TRUE
INVARIANTS
  TypeOK
  OnMeansLive
  InSyncAtTail
  OneExecutionPerTermination
  RetriesBounded
  RetriesReexecute
PROPERTIES
  PerSubscriberContract
  MulticastStep
  ErrorReachesEveryone
