\* DEMO, expected to FAIL: shareReplay(1) without refCount keeps the source
\* running after every subscription has left. The counterexample is the
\* well-known shareReplay leak.
SPECIFICATION Spec
CONSTANTS
  Subs   = {s1, s2, s3}
  Values = {a, b}
  BufferSize          = 1
  ResetOnComplete     = FALSE
  ResetOnError        = TRUE
  ResetOnRefCountZero = FALSE
  MaxLen         = 3
  MaxConnections = 2
INVARIANTS
  SourceStopsWhenUnused
