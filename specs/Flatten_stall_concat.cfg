\* LIVENESS DEMO, expected to FAIL: concatMap behind an inner that never
\* completes. SpecInnerMayHang is fair on everything except InnerComplete.
\* The counterexample is inner 2 queued forever while inner 1, having
\* delivered all its values, never completes.
SPECIFICATION SpecInnerMayHang
CONSTANTS
  Strategy = "concat"
  MaxOuter = 2
  MaxInner = 1
PROPERTIES
  PendingInnersEventuallyRun
