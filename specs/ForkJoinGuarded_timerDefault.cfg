\* forkJoin([a$, b$.pipe(takeUntil(timer(2)), defaultIfEmpty(dflt))]): terminates
\* whatever B does, and the branch always contributes a value.
SPECIFICATION SpecSilentB
CONSTANTS
  Guard   = "takeUntilTimerDefault"
  MaxTime = 4
  Values  = {x, y}
  Default = dflt
  D       = 2
  MaxLen  = 2
INVARIANTS
  TypeOK
  NothingBeforeAllComplete
  AtMostOneEmission
  EmitsJoinedValues
  UnsubscribedWhenBranchDone
  BranchMatchesGuard
  BranchEndsByDeadline
  BranchCompletesWithValue
PROPERTIES
  ObservableContract
  DeliveryCompletes
  EventuallyTerminal
