\* shareReplay({bufferSize: 1, refCount: true}): as shareReplay(1), but the
\* source is unsubscribed when the last subscription leaves.
SPECIFICATION Spec
CONSTANTS
  Subs   = {s1, s2, s3}
  Values = {a, b}
  BufferSize          = 1
  ResetOnComplete     = FALSE
  ResetOnError        = TRUE
  ResetOnRefCountZero = TRUE
  MaxLen         = 3
  MaxConnections = 2
INVARIANTS
  TypeOK
  JoinedIffSubscribed
  OnMeansLive
  BufferIsRecent
  NoGaps
  InSyncAtTail
  ReplayCoversBuffer
  SourceStopsWhenUnused
PROPERTIES
  PerSubscriberContract
  MulticastStep
  NoDeliveryAfterEnd
  CompletedStays
